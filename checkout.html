<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - NOIR BLVNK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tienda.css">
    <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=MXN&components=buttons"></script>
</head>
<body>
    <div class="grain"></div>
    <nav class="shop-nav">
        <div class="shop-nav-top">
            <a href="index.html" class="shop-logo" aria-label="NOIR BLVNK"><img src="logonoir.jpg" alt="NOIR BLVNK"></a>
        </div>
    </nav>
    <main class="cart-main">
        <div class="cart-container">
            <div class="cart-head">
                <div><span class="shop-section-eyebrow">Checkout</span><h1 class="cart-title">Finalizar compra</h1></div>
                <a href="carrito.html" class="cart-keep"><- Volver al carrito</a>
            </div>
            <div class="cart-grid">
                <div class="cart-items" id="checkoutItems"></div>
                <aside class="cart-summary">
                    <h2 class="cart-summary-title">Resumen</h2>
                    <div class="cart-summary-row"><span>Subtotal</span><strong id="checkoutSubtotal">$0 MXN</strong></div>
                    <div class="cart-summary-row cart-summary-row--total"><span>Total</span><strong id="checkoutTotal">$0 MXN</strong></div>
                    <div id="paypal-button-container"></div>
                    <p class="cart-summary-note">Modo pruebas (Sandbox). No se cobra.</p>
                </aside>
            </div>
        </div>
    </main>
    <script src="compartido.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
